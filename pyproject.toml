[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "form-backend-api"
version = "1.0.0"
description = "Headless contact form submission handler with honeypot spam protection"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Afzalbek", email = "afzalbek-dev@users.noreply.github.com"}]

[project.scripts]
form-backend = "form_backend.cli:main"
